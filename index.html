<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Raita ❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<audio id="bgMusic" autoplay loop muted>
  <source src="music.mp3" type="audio/mpeg">
</audio>
<div class="card">
<h1>Hey Raita 🌸</h1>
<img src="us.jpg" width="200" style="border-radius:15px; margin:15px 0;">
<p>From the moment you came into my life, everything felt warmer.</p>
<p>I don’t need a special day to love you… but I want this one to be ours.</p>
<h2>Will you be my Valentine? 💖</h2>


<div class="buttons">
<button onclick="showPopup()">Yes ❤️</button>
<button id="noBtn">No 🙄</button>
</div>
</div>
<div class="heart-container"></div>
<script>
const container = document.querySelector('.heart-container');


setInterval(() => {
const heart = document.createElement('span');
heart.innerHTML = '❤';
heart.style.left = Math.random() * 100 + 'vw';
heart.style.animationDuration = (3 + Math.random() * 3) + 's';
heart.style.fontSize = (18 + Math.random() * 24) + 'px';


container.appendChild(heart);


setTimeout(() => {
heart.remove();
}, 7000);
}, 120);
</script>
<script>
window.addEventListener('load', () => {
  const music = document.getElementById('bgMusic');
  music.muted = false;
  music.volume = 0.6;
});
</script>
<script>
document.body.addEventListener('click', () => {
  const music = document.getElementById('bgMusic');
  music.play();
}, { once: true });
</script>
<script>
function showPopup() {
document.getElementById('popup').style.display = 'flex';
launchConfetti();
}


function closePopup() {
document.getElementById('popup').style.display = 'none';
}


function launchConfetti() {
for (let i = 0; i < 300; i++) {
const confetti = document.createElement('div');
confetti.className = 'confetti';
confetti.style.left = Math.random() * 100 + 'vw';
confetti.style.backgroundColor = ['#ff4d6d', '#ffd166', '#ef476f', '#06d6a0'][Math.floor(Math.random()*4)];
confetti.style.animationDuration = (3 + Math.random() * 3) + 's';
confetti.style.opacity = Math.random();


document.body.appendChild(confetti);


setTimeout(() => confetti.remove(), 6000);
}
}
</script>
<div id="popup" class="popup-overlay">
<div class="popup">
<h2>💖 She said YES 💖</h2>
<p>
You already had my heart.
<br>
This just made it official.
</p>
<button onclick="closePopup()">Close</button>
</div>
</div>
<script>
const noBtn = document.getElementById('noBtn');
noBtn.addEventListener('mouseover', () => {
const x = Math.random() * 200 - 100;
const y = Math.random() * 200 - 100;
noBtn.style.transform = `translate(${x}px, ${y}px)`;
});
</script>
</body>
</html>
